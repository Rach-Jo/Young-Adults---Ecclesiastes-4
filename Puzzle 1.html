<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Puzzle 1: Hidden Letter Hunt</title>
  <style>
    :root {
      --sea-bg: linear-gradient(135deg, #0284c7 0%, #0369a1 40%, #0f172a 100%);
      --card-bg: rgba(15, 23, 42, 0.85);
      --sand-gold: #fde047;
      --seafoam: #38bdf8;
      --danger: #ef4444;
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--sea-bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      position: relative;
      overflow-x: hidden;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px;
      padding: 20px 15px;
      max-width: 800px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      text-align: center;
      position: relative;
    }

    h1 {
      color: var(--sand-gold);
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      text-shadow: 0 2px 10px rgba(253, 224, 71, 0.3);
      margin-bottom: 6px;
    }

    .instructions {
      margin-bottom: 16px;
      font-size: clamp(0.85rem, 3vw, 1.05rem);
      line-height: 1.4;
      color: #bae6fd;
    }

    /* SVG Scene & Magnifier Wrapper */
    .scene-wrapper {
      position: relative;
      width: 100%;
      max-width: 650px;
      margin: 0 auto 12px auto;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      background: #022c22;
      touch-action: none;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      aspect-ratio: 8 / 5;
    }

    /* Responsive Magnifying Glass */
    .magnifier {
      position: absolute;
      width: clamp(90px, 25vw, 130px);
      height: clamp(90px, 25vw, 130px);
      border: 3px solid var(--sand-gold);
      border-radius: 50%;
      pointer-events: none;
      display: none;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.3);
      background-repeat: no-repeat;
      z-index: 10;
    }

    /* Directional Navigation Pad */
    .nav-controls {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(2, 44px);
      gap: 6px;
      justify-content: center;
      margin: 0 auto 16px auto;
    }

    .nav-btn {
      background: rgba(14, 165, 233, 0.25);
      border: 2px solid var(--seafoam);
      color: #fff;
      font-size: 1.2rem;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      transition: background 0.1s, transform 0.1s;
    }

    .nav-btn:active {
      background: var(--seafoam);
      color: #0f172a;
      transform: scale(0.95);
    }

    .nav-btn.up { grid-column: 2; grid-row: 1; }
    .nav-btn.left { grid-column: 1; grid-row: 2; }
    .nav-btn.down { grid-column: 2; grid-row: 2; }
    .nav-btn.right { grid-column: 3; grid-row: 2; }

    /* Camouflaged Letter Styling */
    .hidden-c {
      font-family: 'Times New Roman', serif;
      font-weight: bold;
      font-size: 11px;
      fill: #022c22;
      opacity: 0.14;
      user-select: none;
    }

    .found-marker {
      fill: none;
      stroke: var(--sand-gold);
      stroke-width: 2.5;
      stroke-dasharray: 4;
      animation: spin 6s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Form Controls */
    .submit-box {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    input[type="text"] {
      padding: 8px 12px;
      font-size: clamp(1rem, 4vw, 1.2rem);
      font-weight: bold;
      width: clamp(80px, 25vw, 110px);
      text-align: center;
      text-transform: uppercase;
      border: 2px solid #0284c7;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.8);
      color: #fff;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--sand-gold);
      box-shadow: 0 0 8px rgba(253, 224, 71, 0.5);
    }

    button.submit-btn {
      padding: 10px 20px;
      font-size: clamp(0.9rem, 3.5vw, 1rem);
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      color: white;
      cursor: pointer;
      box-shadow: 0 3px 0 #0369a1;
      transition: transform 0.1s;
    }

    button.submit-btn:hover { filter: brightness(1.1); }
    button.submit-btn:active { transform: translateY(2px); }

    .message {
      font-weight: 800;
      font-size: clamp(1rem, 3.8vw, 1.25rem);
      min-height: 30px;
    }

    .success { color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
    .error { color: #f87171; }

    /* Floating Penalty Text Animation */
    .floating-penalty {
      position: absolute;
      color: #ef4444;
      font-weight: 900;
      font-size: 1.5rem;
      pointer-events: none;
      animation: floatUp 1.2s forwards ease-out;
      text-shadow: 0 0 8px rgba(239, 68, 68, 0.8);
      z-index: 50;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-50px) scale(1.2);
      }
    }

    /* Completion View Styling */
    .results-page {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 10px;
    }

    .letter-display {
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 900;
      color: var(--sand-gold);
      text-shadow: 0 0 20px rgba(253, 224, 71, 0.6);
      margin: 10px 0;
    }

    .score-badge {
      background: rgba(14, 165, 233, 0.2);
      border: 2px solid var(--seafoam);
      border-radius: 12px;
      padding: 12px 24px;
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      font-weight: 800;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Game Page Container -->
  <div class="container" id="gameContainer">
    <h1>Puzzle 1: Hidden Letter Hunt</h1>

    <p class="instructions">
      Use touch/mouse or the <strong>arrow buttons</strong> to navigate your magnifying glass.<br>
      Type the letter in the box below and tap submit!
    </p>

    <!-- SVG Scene & Magnifier -->
    <div class="scene-wrapper" id="sceneWrapper">
      <div class="magnifier" id="magnifier"></div>

      <svg viewBox="0 0 800 500" id="mainSvg">
        <defs>
          <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#065f46" />
          </linearGradient>
          <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#047857" />
            <stop offset="100%" stop-color="#022c22" />
          </linearGradient>
        </defs>

        <rect width="800" height="500" fill="url(#skyGrad)" />
        <circle cx="680" cy="90" r="45" fill="#fde047" opacity="0.25" />

        <path d="M 0,320 Q 200,240 400,310 T 800,280 L 800,500 L 0,500 Z" fill="url(#hillGrad)" />
        <path d="M 0,360 Q 250,300 500,370 T 800,340 L 800,500 L 0,500 Z" fill="#024e3a" />
        <path d="M -20,410 Q 150,370 350,420 T 820,390 L 820,500 L -20,500 Z" fill="#064e3b" />

        <circle cx="120" cy="280" r="70" fill="#047857" opacity="0.9" />
        <circle cx="160" cy="250" r="50" fill="#059669" opacity="0.8" />
        <rect x="130" y="320" width="20" height="100" fill="#78350f" rx="5" />

        <path d="M 520,500 C 500,380 580,330 650,340 C 720,350 750,380 820,370 L 820,500 Z" fill="#0369a1" opacity="0.3" />
        <path d="M 530,500 C 510,390 590,340 660,350 C 730,360 760,390 820,380 L 820,500 Z" fill="#047857" />

        <path d="M 560,420 A 12,12 0 0,1 580,420" stroke="#022c22" stroke-width="2.5" fill="none" />
        <path d="M 572,415 A 10,10 0 0,1 590,415" stroke="#065f46" stroke-width="2" fill="none" />
        <path d="M 585,428 A 11,11 0 0,1 602,428" stroke="#022c22" stroke-width="2.5" fill="none" />
        <path d="M 598,435 A 8,8 0 0,1 612,435" stroke="#034e38" stroke-width="2" fill="none" />
        <path d="M 618,442 A 9,9 0 0,1 632,442" stroke="#022c22" stroke-width="2.5" fill="none" />
        <path d="M 605,422 A 7,7 0 0,1 617,422" stroke="#065f46" stroke-width="2" fill="none" />
        <path d="M 622,410 A 12,12 0 0,1 640,410" stroke="#022c22" stroke-width="2.5" fill="none" />

        <text 
          x="602" 
          y="423" 
          class="hidden-c" 
          id="hiddenLetter"
          transform="rotate(42 602 423)"
        >C</text>

        <circle id="foundCircle" cx="602" cy="420" r="16" class="found-marker" style="display: none;" />
      </svg>
    </div>

    <!-- Directional Navigation Buttons -->
    <div class="nav-controls">
      <button class="nav-btn up" onpointerdown="startMove('up')" onpointerup="stopMove()" onpointerleave="stopMove()">▲</button>
      <button class="nav-btn left" onpointerdown="startMove('left')" onpointerup="stopMove()" onpointerleave="stopMove()">◄</button>
      <button class="nav-btn down" onpointerdown="startMove('down')" onpointerup="stopMove()" onpointerleave="stopMove()">▼</button>
      <button class="nav-btn right" onpointerdown="startMove('right')" onpointerup="stopMove()" onpointerleave="stopMove()">►</button>
    </div>

    <!-- Controls -->
    <div class="submit-box" id="submitBox">
      <input type="text" id="letterInput" maxlength="1" placeholder="?" />
      <button class="submit-btn" id="submitBtn" onclick="checkAnswer()">Submit</button>
    </div>

    <div class="message" id="message"></div>
  </div>

  <!-- Results View Page -->
  <div class="container results-page" id="resultsContainer">
    <h1>Puzzle Completed!</h1>
    <p class="instructions">The first letter found is:</p>
    <div class="letter-display">"C"</div>
    <div class="score-badge">Your Points: <span id="finalScore">0</span></div>
  </div>

  <script>
    const sceneWrapper = document.getElementById('sceneWrapper');
    const magnifier = document.getElementById('magnifier');
    const mainSvg = document.getElementById('mainSvg');
    const letterInput = document.getElementById('letterInput');
    const messageDiv = document.getElementById('message');
    const gameContainer = document.getElementById('gameContainer');
    const resultsContainer = document.getElementById('resultsContainer');
    const submitBox = document.getElementById('submitBox');
    const finalScoreDisplay = document.getElementById('finalScore');

    let startTime = Date.now();
    let wrongAttempts = 0;
    let svgDataUrl = "";

    // Position coordinates for arrow navigation
    let posX = 0;
    let posY = 0;
    let moveInterval = null;

    function prepareMagnifier() {
      const svgString = new XMLSerializer().serializeToString(mainSvg);
      const encodedSvg = encodeURIComponent(svgString);
      svgDataUrl = `url("data:image/svg+xml;utf8,${encodedSvg}")`;
      magnifier.style.backgroundImage = svgDataUrl;
    }

    window.onload = () => {
      prepareMagnifier();
      startTime = Date.now();

      // Initialize glass position in center of scene
      const rect = sceneWrapper.getBoundingClientRect();
      posX = rect.width / 2;
      posY = rect.height / 2;
    };

    function updateMagnifierPos(x, y) {
      const rect = sceneWrapper.getBoundingClientRect();

      // Clamp position within boundaries
      posX = Math.max(0, Math.min(x, rect.width));
      posY = Math.max(0, Math.min(y, rect.height));

      magnifier.style.display = 'block';

      const magWidth = magnifier.offsetWidth;
      const magHeight = magnifier.offsetHeight;

      magnifier.style.left = `${posX - magWidth / 2}px`;
      magnifier.style.top = `${posY - magHeight / 2}px`;

      const zoom = 2.5;
      magnifier.style.backgroundSize = `${rect.width * zoom}px ${rect.height * zoom}px`;
      magnifier.style.backgroundPosition = `-${posX * zoom - magWidth / 2}px -${posY * zoom - magHeight / 2}px`;
    }

    // Direct touch / mouse movement
    function updateMagnifierFromEvent(clientX, clientY) {
      const rect = sceneWrapper.getBoundingClientRect();
      updateMagnifierPos(clientX - rect.left, clientY - rect.top);
    }

    sceneWrapper.addEventListener('mousemove', (e) => updateMagnifierFromEvent(e.clientX, e.clientY));

    sceneWrapper.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        updateMagnifierFromEvent(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    sceneWrapper.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        updateMagnifierFromEvent(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    // Arrow Button Navigation Logic
    function move(direction) {
      const step = 8; // Pixel adjustment per frame
      if (direction === 'up') posY -= step;
      if (direction === 'down') posY += step;
      if (direction === 'left') posX -= step;
      if (direction === 'right') posX += step;

      updateMagnifierPos(posX, posY);
    }

    function startMove(direction) {
      move(direction);
      clearInterval(moveInterval);
      moveInterval = setInterval(() => move(direction), 30);
    }

    function stopMove() {
      clearInterval(moveInterval);
    }

    function triggerPenaltyAnimation() {
      const penaltyEl = document.createElement('div');
      penaltyEl.className = 'floating-penalty';
      penaltyEl.innerText = '-20 points';

      const rect = submitBox.getBoundingClientRect();
      const containerRect = gameContainer.getBoundingClientRect();

      penaltyEl.style.left = `${rect.left - containerRect.left + rect.width / 2 - 40}px`;
      penaltyEl.style.top = `${rect.top - containerRect.top - 20}px`;

      gameContainer.appendChild(penaltyEl);

      setTimeout(() => {
        penaltyEl.remove();
      }, 1200);
    }

    function checkAnswer() {
      const userGuess = letterInput.value.trim().toUpperCase();

      if (!userGuess) {
        messageDiv.className = 'message error';
        messageDiv.innerText = '⚠️ Please enter a letter!';
        return;
      }

      if (userGuess === 'C') {
        const endTime = Date.now();
        const totalTimeSeconds = Math.floor((endTime - startTime) / 1000);

        // Tiered time-based scoring
        let baseScore = 10;
        if (totalTimeSeconds <= 5) {
          baseScore = 100;
        } else if (totalTimeSeconds <= 10) {
          baseScore = 90;
        } else if (totalTimeSeconds <= 15) {
          baseScore = 80;
        } else if (totalTimeSeconds <= 20) {
          baseScore = 70;
        } else if (totalTimeSeconds <= 25) {
          baseScore = 60;
        } else if (totalTimeSeconds <= 30) {
          baseScore = 50;
        } else if (totalTimeSeconds <= 35) {
          baseScore = 40;
        } else if (totalTimeSeconds <= 40) {
          baseScore = 30;
        } else if (totalTimeSeconds <= 45) {
          baseScore = 20;
        } else if (totalTimeSeconds <= 50) {
          baseScore = 10;
        }

        // Apply wrong attempt penalty with a minimum score floor of 10
        const finalScore = Math.max(10, baseScore - (wrongAttempts * 20));

        messageDiv.className = 'message success';
        messageDiv.innerText = 'Good job in finding the first letter';

        const letter = document.getElementById('hiddenLetter');
        letter.style.fill = '#fde047';
        letter.style.opacity = '1';
        letter.style.fontSize = '22px';
        document.getElementById('foundCircle').style.display = 'block';

        setTimeout(() => {
          gameContainer.style.display = 'none';
          resultsContainer.style.display = 'flex';
          finalScoreDisplay.innerText = finalScore;
        }, 1500);

      } else {
        wrongAttempts++;
        messageDiv.className = 'message error';
        messageDiv.innerText = 'try again';
        triggerPenaltyAnimation();
        letterInput.value = '';
      }
    }
  </script>
</body>
</html>
