<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Station 1: Hidden Letter Hunt</title>
  <style>
    :root {
      --sea-bg: linear-gradient(135deg, #0284c7 0%, #0369a1 40%, #0f172a 100%);
      --card-bg: rgba(15, 23, 42, 0.85);
      --sand-gold: #fde047;
      --seafoam: #38bdf8;
      --danger: #ef4444;
      --text: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--sea-bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      position: relative;
    }

    /* Penalty Timer Banner */
    .timer-banner {
      position: fixed;
      top: 15px;
      right: 15px;
      background: rgba(127, 29, 29, 0.95);
      border: 2px solid var(--danger);
      border-radius: 12px;
      padding: 8px 16px;
      font-weight: 800;
      color: #fca5a5;
      font-size: 1rem;
      display: none;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
      z-index: 100;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px;
      padding: 20px 15px;
      max-width: 800px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    h1 {
      color: var(--sand-gold);
      font-size: clamp(1.5rem, 5vw, 2.2rem);
      text-shadow: 0 2px 10px rgba(253, 224, 71, 0.3);
      margin-bottom: 6px;
    }

    .instructions {
      margin-bottom: 16px;
      font-size: clamp(0.85rem, 3vw, 1.05rem);
      line-height: 1.4;
      color: #bae6fd;
    }

    /* SVG Scene & Magnifier Wrapper */
    .scene-wrapper {
      position: relative;
      width: 100%;
      max-width: 650px;
      margin: 0 auto 16px auto;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      background: #022c22;
      touch-action: none; /* Prevents page scroll while dragging finger */
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      aspect-ratio: 8 / 5;
    }

    /* Responsive Magnifying Glass Window */
    .magnifier {
      position: absolute;
      width: clamp(90px, 25vw, 130px);
      height: clamp(90px, 25vw, 130px);
      border: 3px solid var(--sand-gold);
      border-radius: 50%;
      pointer-events: none;
      display: none;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.3);
      background-repeat: no-repeat;
      z-index: 10;
    }

    /* Ultra-Camouflaged Letter C Styling */
    .hidden-c {
      font-family: 'Times New Roman', serif;
      font-weight: bold;
      font-size: 11px;
      fill: #022c22;
      opacity: 0.14;
      user-select: none;
    }

    .found-marker {
      fill: none;
      stroke: var(--sand-gold);
      stroke-width: 2.5;
      stroke-dasharray: 4;
      animation: spin 6s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .disabled-input {
      pointer-events: none;
      filter: grayscale(0.8);
    }

    /* Submission Form Controls */
    .submit-box {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    input[type="text"] {
      padding: 8px 12px;
      font-size: clamp(1rem, 4vw, 1.2rem);
      font-weight: bold;
      width: clamp(80px, 25vw, 110px);
      text-align: center;
      text-transform: uppercase;
      border: 2px solid #0284c7;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.8);
      color: #fff;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--sand-gold);
      box-shadow: 0 0 8px rgba(253, 224, 71, 0.5);
    }

    button {
      padding: 10px 20px;
      font-size: clamp(0.9rem, 3.5vw, 1rem);
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
      color: white;
      cursor: pointer;
      box-shadow: 0 3px 0 #0369a1;
      transition: transform 0.1s;
    }

    button:hover { filter: brightness(1.1); }
    button:active { transform: translateY(2px); }

    .message {
      font-weight: 800;
      font-size: clamp(1rem, 3.8vw, 1.25rem);
      min-height: 30px;
    }

    .success { color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
    .error { color: #f87171; }
  </style>
</head>
<body>

  <!-- Penalty Clock -->
  <div class="timer-banner" id="timerBanner">
    🚨 Penalty: <span id="timerVal">10</span>s
  </div>

  <div class="container" id="mainContainer">
    <h1>Station 1: Hidden Letter Hunt</h1>

    <p class="instructions">
      Use your 🔍 <strong>magnifying glass</strong> to inspect the scene and find the hidden letter.<br>
      Type the letter in the box below and tap submit!
    </p>

    <!-- SVG Scene & Magnifier -->
    <div class="scene-wrapper" id="sceneWrapper">
      <div class="magnifier" id="magnifier"></div>

      <svg viewBox="0 0 800 500" id="mainSvg">
        <defs>
          <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#065f46" />
          </linearGradient>
          <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#047857" />
            <stop offset="100%" stop-color="#022c22" />
          </linearGradient>
        </defs>

        <!-- Background & Scene elements -->
        <rect width="800" height="500" fill="url(#skyGrad)" />
        <circle cx="680" cy="90" r="45" fill="#fde047" opacity="0.25" />

        <path d="M 0,320 Q 200,240 400,310 T 800,280 L 800,500 L 0,500 Z" fill="url(#hillGrad)" />
        <path d="M 0,360 Q 250,300 500,370 T 800,340 L 800,500 L 0,500 Z" fill="#024e3a" />
        <path d="M -20,410 Q 150,370 350,420 T 820,390 L 820,500 L -20,500 Z" fill="#064e3b" />

        <circle cx="120" cy="280" r="70" fill="#047857" opacity="0.9" />
        <circle cx="160" cy="250" r="50" fill="#059669" opacity="0.8" />
        <rect x="130" y="320" width="20" height="100" fill="#78350f" rx="5" />

        <path d="M 520,500 C 500,380 580,330 650,340 C 720,350 750,380 820,370 L 820,500 Z" fill="#0369a1" opacity="0.3" />
        <path d="M 530,500 C 510,390 590,340 660,350 C 730,360 760,390 820,380 L 820,500 Z" fill="#047857" />

        <path d="M 560,420 A 12,12 0 0,1 580,420" stroke="#022c22" stroke-width="2.5" fill="none" />
        <path d="M 572,415 A 10,10 0 0,1 590,415" stroke="#065f46" stroke-width="2" fill="none" />
        <path d="M 585,428 A 11,11 0 0,1 602,428" stroke="#022c22" stroke-width="2.5" fill="none" />
        <path d="M 598,435 A 8,8 0 0,1 612,435" stroke="#034e38" stroke-width="2" fill="none" />
        <path d="M 618,442 A 9,9 0 0,1 632,442" stroke="#022c22" stroke-width="2.5" fill="none" />
        <path d="M 605,422 A 7,7 0 0,1 617,422" stroke="#065f46" stroke-width="2" fill="none" />
        <path d="M 622,410 A 12,12 0 0,1 640,410" stroke="#022c22" stroke-width="2.5" fill="none" />

        <!-- Micro-Hidden Letter 'C' -->
        <text 
          x="602" 
          y="423" 
          class="hidden-c" 
          id="hiddenLetter"
          transform="rotate(42 602 423)"
        >C</text>

        <circle id="foundCircle" cx="602" cy="420" r="16" class="found-marker" style="display: none;" />
      </svg>
    </div>

    <!-- Letter Input & Verification -->
    <div class="submit-box">
      <input type="text" id="letterInput" maxlength="1" placeholder="?" />
      <button id="submitBtn" onclick="checkAnswer()">Submit</button>
    </div>

    <div class="message" id="message"></div>
  </div>

  <script>
    const sceneWrapper = document.getElementById('sceneWrapper');
    const magnifier = document.getElementById('magnifier');
    const mainSvg = document.getElementById('mainSvg');
    const letterInput = document.getElementById('letterInput');
    const messageDiv = document.getElementById('message');
    const timerBanner = document.getElementById('timerBanner');
    const timerVal = document.getElementById('timerVal');
    const mainContainer = document.getElementById('mainContainer');
    const submitBtn = document.getElementById('submitBtn');

    let penaltyActive = false;
    let svgDataUrl = "";

    function prepareMagnifier() {
      const svgString = new XMLSerializer().serializeToString(mainSvg);
      const encodedSvg = encodeURIComponent(svgString);
      svgDataUrl = `url("data:image/svg+xml;utf8,${encodedSvg}")`;
      magnifier.style.backgroundImage = svgDataUrl;
    }

    window.onload = () => {
      prepareMagnifier();
    };

    // Unified positioning for mouse and touch events
    function updateMagnifier(clientX, clientY) {
      if (penaltyActive) return;

      const rect = sceneWrapper.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;

      if (x < 0 || x > rect.width || y < 0 || y > rect.height) {
        magnifier.style.display = 'none';
        return;
      }

      magnifier.style.display = 'block';

      const magWidth = magnifier.offsetWidth;
      const magHeight = magnifier.offsetHeight;

      magnifier.style.left = `${x - magWidth / 2}px`;
      magnifier.style.top = `${y - magHeight / 2}px`;

      const zoom = 2.5;
      magnifier.style.backgroundSize = `${rect.width * zoom}px ${rect.height * zoom}px`;
      magnifier.style.backgroundPosition = `-${x * zoom - magWidth / 2}px -${y * zoom - magHeight / 2}px`;
    }

    // Mouse Listeners
    sceneWrapper.addEventListener('mousemove', (e) => updateMagnifier(e.clientX, e.clientY));
    sceneWrapper.addEventListener('mouseleave', () => magnifier.style.display = 'none');

    // Touch Listeners for Mobile devices
    sceneWrapper.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        updateMagnifier(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    sceneWrapper.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        updateMagnifier(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    sceneWrapper.addEventListener('touchend', () => magnifier.style.display = 'none');

    function startPenaltyClock() {
      penaltyActive = true;
      let secondsLeft = 10;

      timerBanner.style.display = 'block';
      timerVal.innerText = secondsLeft;
      mainContainer.classList.add('disabled-input');
      submitBtn.disabled = true;
      magnifier.style.display = 'none';

      const interval = setInterval(() => {
        secondsLeft--;
        timerVal.innerText = secondsLeft;

        if (secondsLeft <= 0) {
          clearInterval(interval);
          penaltyActive = false;
          timerBanner.style.display = 'none';
          mainContainer.classList.remove('disabled-input');
          submitBtn.disabled = false;
          messageDiv.innerText = '';
        }
      }, 1000);
    }

    function checkAnswer() {
      if (penaltyActive) return;

      const userGuess = letterInput.value.trim().toUpperCase();

      if (!userGuess) {
        messageDiv.className = 'message error';
        messageDiv.innerText = '⚠️ Please enter a letter!';
        return;
      }

      if (userGuess === 'C') {
        messageDiv.className = 'message success';
        messageDiv.innerText = 'Good job in finding the first letter';

        const letter = document.getElementById('hiddenLetter');
        letter.style.fill = '#fde047';
        letter.style.opacity = '1';
        letter.style.fontSize = '22px';
        document.getElementById('foundCircle').style.display = 'block';

        prepareMagnifier();
      } else {
        messageDiv.className = 'message error';
        messageDiv.innerText = 'try again';
        startPenaltyClock();
      }
    }
  </script>
</body>
</html>
